<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/main.css" th:href="@{/css/main.css}" rel="stylesheet">
    <style>
      .container {
        max-width: 900px;
      }

      .form-select {
        margin-top: 8px;
      }

    </style>

</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Second navar example">
  <div class="container-fluid">
    <h1 class="d-flex align-items-center fs-4 text-white mb-0">
      <img src="../static/img/logo.svg" th:src="@{/img/logo.svg}"
           width="38" height="30" class="me-3" alt="Bootstrap">
      TaskHive
    </h1>
    <div class="collapse navbar-collapse navbar-options">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="#" th:href="@{/}">Home</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" href="#" aria-current="page" th:href="@{/task}">Task</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
          <a class="nav-link" href="#" th:href="@{/admin/}">Admin</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
          <th:block th:with="auth=${#authentication.getPrincipal()}">
            <a class="nav-link dropdown-toggle" href="#" id="dropdown03" role="button" data-bs-toggle="dropdown"></a>
          </th:block>
          <ul class="dropdown-menu dropdown-menu end" aria-labelledby="dropdown03">
            <li>
              <form style="..." th:action="@{/logout}" method="post" id="logoutForm"></form>
              <a class="dropdown-item" href="javascript:document.getElementById(logoutForm)" >Logout</a>
            </li>
          </ul>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
          <a class="nav-link" href="#" th:href="@{/login}">Login</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<main>
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col">
        <div class="card rounder-3">
          <div class="card-body p-4">
              <div class="row mb-4 justify-content-center" th:if="${dashboard != null}">
                  <div class="col-md-3">
                      <div class="card text-white bg-primary">
                          <div class="card-body text-center">
                              <h5 class="card-title">Total tareas</h5>
                              <h2 th:text="${dashboard.totalTasks}">0</h2>
                          </div>
                      </div>
                  </div>
                  <div class="col-md-3">
                      <div class="card text-white bg-success">
                          <div class="card-body text-center">
                              <h5 class="card-title">Completadas</h5>
                              <h2 th:text="${dashboard.completedTasks}">0</h2>
                          </div>
                      </div>
                  </div>
                  <div class="col-md-3">
                      <div class="card text-white bg-danger">
                          <div class="card-body text-center">
                              <h5 class="card-title">Vencidas</h5>
                              <h2 th:text="${dashboard.overdueTasks}">0</h2>
                          </div>
                      </div>
                  </div>
              </div>
              <div class="mb-3">
                  <a href="/task/new" class="btn btn-primary">Nueva tarea</a>
                  <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#filtros" >
                      Buscar tareas
                  </button>
              </div>
            <div class="collapse mb-3" id="filtros">
                <div class="card card-body">
                    <form class="row g-3" action="#" th:action="@{/task/search}" method="GET">
                        <div class="col-md-4">
                            <input type="text" name="title" class="form-control" placeholder="Buscar por título">
                        </div>
                        <div class="col-md-4">
                            <select name="priority" class="form-select">
                                <option value="">Todas las prioridades</option>
                                <option value="BAJA">Baja</option>
                                <option value="MEDIA">Media</option>
                                <option value="ALTA">Alta</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select name="categoryId" class="form-select">
                                <option value="">Todas las categorías</option>
                                <option th:each="category : ${categoryList}" th:value="${category.id}" th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select name="completed" class="form-select">
                                <option value="">Todos los estados</option>
                                <option value="true">Completadas</option>
                                <option value="false">Pendientes</option>
                                <option value="overdue">Vencidas</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select name="tagId" class="form-select">
                            <option value="">Todas las etiquetas</option>
                            <option value="1">Urgente</option>
                            <option value="2">Importante</option>
                            <option value="3">Ocio</option>
                        </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Buscar</button>
                        </div>
                    </form>
                </div>
            </div>




          <div class="container" style="..." th:if="${param.emptyListError != null}">
            <h1 class="text-center" sec:authorize="hasRole('ROLE_USER')">Crea tu primera tarea...</h1>
            <img src="../static/img/empty-list.jpg" th:src="@{/img/empty-list.jpg}"
                 width="100%"/>
          </div>


          <table class="table mb-4" th:if="${param.emptyListError == null}">
            <thead>
            <tr>
              <th scope="col">Id.</th>
              <th scope="col">Título</th>
              <th scope="col">Descripción</th>
              <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${taskList}" th:classappend="${task.completed} ? 'table-success'">
              <th scope="row" th:text="${task.id}">1</th>
              <td th:text="${task.title}">Buy groceries for next week</td>
              <td th:text="${#strings.abbreviate(task.description, 50)}">Loren ipsum dolor sit amet</td>
              <td>
                  <a href="#" th:href="@{/task/{id}(id=${task.id})}" class="btn btn-primary">Ver</a>
                  <a class="btn btn-danger" th:onclick="|deleteTask(${task.id})|">Borrar</a>
                  <form style="display:none" th:action="@{/task/{id}/del(id=${task.id})}" method="post" th:id="${'delete-task-'+task.id}"></form>
                  <a href="#" th:href="@{/task/{id}/toggle(id=${task.id})}" class="btn ms-1"
                     th:classappend="${task.completed} ? 'btn-ligt' : 'btn-dark'"
                     th:text="${task.completed} ? 'Completada' : 'Completar'">Completar</a>
              </td>
            </tr>
            </tbody>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="footer mt-auto py-3 bg-light fixed-bottom">
    <div class="container">
        <input class="form-check-input" type="checkbox" value="" id="flexCheckCheckedDisabled" checked disabled>
    <span class="text-muted">TaskHive - DWES - Laura Aller de Silva</span>
  </div>
</footer>
<script>
    function deleteTask(id) {
      if (confirm('Are you sure to delete this Task?')) {
        document.getElementById('delete-task-'+id).submit();
      }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

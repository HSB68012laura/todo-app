<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ver Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/main.css" th:href="@{/css/main.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column h-100">
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
        <h1 class="d-flex align-items-center fs-4 text-white mb-0">
            <img src="../static/img/logo.svg" th:src="@{/img/logo.svg}" width="38" height="30" class="me-3" alt="Logo">
            TaskHive
        </h1>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/task}">Tareas</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="flex-shrink-0">
    <div class="container py-5">
        <div class="card">
            <div class="card-header">
                <h3>Detalle de la tarea</h3>
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <tr>
                        <th>ID</th>
                        <td th:text="${task.id}">-</td>
                    </tr>
                    <tr>
                        <th>Título</th>
                        <td th:text="${task.title}">-</td>
                    </tr>
                    <tr>
                        <th>Descripción</th>
                        <td th:text="${task.description}">-</td>
                    </tr>
                    <tr>
                        <th>Prioridad</th>
                        <td th:text="${task.priority}">-</td>
                    </tr>
                    <tr>
                        <th>Estado</th>
                        <td>
                            <span th:if="${task.completed}" class="badge bg-success">Completada</span>
                            <span th:if="!${task.completed}" class="badge bg-warning">Pendiente</span>
                        </td>
                    </tr>
                    <tr>
                        <th>Fecha creación</th>
                        <td th:text="${task.createdAt}">-</td>
                    </tr>
                    <tr>
                        <th>Fecha límite</th>
                        <td th:text="${task.deadline}">-</td>
                    </tr>
                    <tr th:if="${task.author}">
                        <th>Autor</th>
                        <td th:text="${task.author.username}">-</td>
                    </tr>
                </table>
                <a th:href="@{/task}" class="btn btn-secondary">Volver</a>
                <a th:href="@{/task/{id}/edit(id=${task.id})}" class="btn btn-primary">Editar</a>
            </div>
        </div>
    </div>
</main>
<footer class="footer mt-auto py-3 bg-light fixed-bottom">
    <div class="container">
        <span class="text-muted">TaskHive - DWES</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

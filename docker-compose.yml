version: '3.8'

services:
  backend:
    image: HSB68012laura/todo-rest:1.0
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - todo-network

  frontend:
    build: src/main/java/com/dwes/todo
    ports:
      - "9000:8080"
    environment:
      - PORT=8080
      - TODO_REST_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge